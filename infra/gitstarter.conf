# gitstarter.xyz — Solana client + SQLite metadata API
#
# Deliberately its OWN file rather than an edit to sites-enabled/agnt.gg: that
# config serves agnt.gg / api / alpha / app, and a syntax error in it would take
# all four down. A separate vhost fails in isolation.
#
# gitstarter.xyz is canonical and every other name redirects to it. A wallet app
# with two live origins has two cookie jars — __Host- cookies are per-origin by
# definition — so a user bouncing between domains re-signs every time, which
# looks exactly like a broken session. And the sign-in message can only name one
# domain: somebody reading gitstarter.xyz while being asked to sign
# "Domain: gitstarter.agnt.gg" is being asked to do the precise thing every
# wallet guide tells them to refuse.
#
# The redirects are 308, not 301. A 301 lets a client turn a POST into a GET,
# which would silently break any agent that posts to /api/v1/tx/* on the old
# domain — it would look like the endpoint returning nothing rather than like a
# redirect. 308 preserves the method and the body.

# ── the canonical origin ────────────────────────────────────────────────────
server {
    server_name gitstarter.xyz;

    root /var/www/gitstarter.agnt.gg/public;
    index index.html;

    access_log /var/log/nginx/gitstarter.access.log;
    error_log  /var/log/nginx/gitstarter.error.log;

    # Certbot writes its challenge under the webroot; keep it explicit so the
    # SPA fallback below can never swallow an ACME request.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/gitstarter.agnt.gg/public;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:3417;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=15768000" always;

    location ~ /\. { deny all; }

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/gitstarter.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gitstarter.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# ── www → apex ──────────────────────────────────────────────────────────────
server {
    server_name www.gitstarter.xyz;

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/gitstarter.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gitstarter.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 308 https://gitstarter.xyz$request_uri;
}

# ── the old domain → the new one ────────────────────────────────────────────
#
# This is not a courtesy, it is load-bearing. The security.txt compiled into the
# deployed program names https://gitstarter.agnt.gg as the project URL, and
# changing that requires a program upgrade — which now takes two of the three
# multisig signers. So this name has to keep answering for as long as that
# binary is live, whatever the site is called.
server {
    server_name gitstarter.agnt.gg;

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/gitstarter.agnt.gg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gitstarter.agnt.gg/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Renewal for this cert must not be redirected away, or it silently stops
    # renewing and the redirect itself dies in 90 days.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/gitstarter.agnt.gg/public;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / { return 308 https://gitstarter.xyz$request_uri; }
}

# ── plain HTTP ──────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name gitstarter.xyz www.gitstarter.xyz gitstarter.agnt.gg;

    # ACME first. A blanket redirect here would break renewal for every name in
    # this file.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/gitstarter.agnt.gg/public;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / { return 308 https://gitstarter.xyz$request_uri; }
}
