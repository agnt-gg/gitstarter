# TEMPORARY — exists only so Let's Encrypt can validate gitstarter.xyz over HTTP.
#
# Deliberately a separate file rather than an edit to the live vhost: until the
# certificate exists, an ssl_certificate line pointing at a missing file makes
# nginx refuse to start, which would take gitstarter down to issue a cert for a
# domain that is not serving anything yet. This adds port 80 only, so the worst
# case is that it does nothing.
#
# Deleted immediately after issuance.
server {
    listen 80;
    listen [::]:80;
    server_name gitstarter.xyz www.gitstarter.xyz;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/gitstarter.agnt.gg/public;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / { return 404; }
}
