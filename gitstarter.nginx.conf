# gitstarter.agnt.gg — static single-page prototype
# Deliberately its OWN file rather than an edit to sites-enabled/agnt.gg:
# that config serves agnt.gg / api / alpha / app, and a syntax error in it
# would take all four down. A separate vhost fails in isolation.
server {
    listen 80;
    listen [::]:80;
    server_name gitstarter.agnt.gg;

    root /var/www/gitstarter.agnt.gg/public;
    index index.html;

    access_log /var/log/nginx/gitstarter.access.log;
    error_log  /var/log/nginx/gitstarter.error.log;

    # Certbot writes its challenge under the webroot; keep it explicit so the
    # SPA fallback below can never swallow an ACME request.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/gitstarter.agnt.gg/public;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The app is one HTML file holding its own state in localStorage. Revalidate
    # it every time so a redeploy is visible on refresh, but let the browser
    # keep any future static assets.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/html application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ~ /\. { deny all; }
}
