<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="GitStarter">
  <!-- Same Solana purple->green gradient as the social card, so a tab and a
       link preview read as the same product. Deliberately borderless: at 16px
       any stroke reduces to a fuzzy line and the mark stops being recognisable. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9945ff"/>
      <stop offset="1" stop-color="#14f195"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#g)"/>
  <!-- Bold G drawn as a path rather than <text>. Font-based text works in
       modern browsers but a favicon rendered by a headless preview or scraper
       often has no fonts installed, and a glyph that quietly falls back to a
       tofu box is worse than no icon at all. A path renders identically in
       every environment. -->
  <path fill="#0d1117" d="M16.5 6c2.6 0 4.8.9 6.4 2.4l-2.3 2.4c-1.1-1-2.5-1.6-4.1-1.6-3.2 0-5.6 2.5-5.6 5.8s2.4 5.8 5.6 5.8c2.5 0 4.4-1.4 5.1-3.5h-5.1v-3h8.7v1.5c0 4.9-3.6 8.4-8.7 8.4-5.1 0-9-3.9-9-9.2S11.4 6 16.5 6z"/>
</svg>
